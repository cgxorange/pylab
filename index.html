<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0c10">
<title>手机 Python</title>
<style>
:root{
  --bg:#0a0c10;--line:#1a2029;--line2:#262d38;
  --panel:#0e141d;--card:#12161d;--btn:#161b22;
  --btnA:#262c36;--hd:#0e141d;
  --text:#e9eff7;--dim:#8b98a8;--dim2:#6b7684;
  --acc:#3fb950;--accbg:#238636;--blue:#58a6ff;--warn:#d29922;--bad:#f85149;
  --tk-c:#8b98a8;--tk-s:#a5d6ff;--tk-k:#ff7b72;--tk-n:#79c0ff;--tk-b:#d2a8ff;
  --sel:rgba(88,166,255,.28);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ui:"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Noto Sans CJK SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
}
body.light{
  --bg:#ffffff;--line:#d8dee4;--line2:#d0d7de;
  --panel:#f6f8fa;--card:#f6f8fa;--btn:#eaeef2;
  --btnA:#dfe3e8;--hd:#ffffff;
  --text:#1f2328;--dim:#5a6472;--dim2:#7a8494;
  --acc:#1a7f37;--accbg:#1f883d;--blue:#0969da;--warn:#9a6700;--bad:#cf222e;
  --tk-c:#6e7781;--tk-s:#0a3069;--tk-k:#cf222e;--tk-n:#0550ae;--tk-b:#8250df;
  --sel:rgba(9,105,218,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--text);font:15.5px/1.68 var(--ui);height:100vh;height:100dvh;overflow:hidden;transition:background .2s,color .2s;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#app{height:100%;display:flex;flex-direction:column;overflow:hidden}
.pg{display:none;flex:1;flex-direction:column;min-height:0;overflow:hidden}
.pg.on{display:flex}

.bar{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;border-bottom:1px solid var(--line)}
.bar h1{font-size:15px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:var(--btn);border:0;color:var(--text);border-radius:9px;font-family:inherit;font-size:13.5px;padding:8px 11px;cursor:pointer;flex:0 0 auto}
.bar button:active{background:var(--btnA)}
#st{font:11px/1 var(--mono);color:var(--dim);margin-right:2px}
#st.ok{color:var(--acc)}#st.bad{color:var(--bad)}

.hpad{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:20px 16px calc(40px + env(safe-area-inset-bottom))}
.hero{text-align:center;padding:14px 8px 26px}
.hero .orb{width:68px;height:68px;margin:0 auto 16px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:34px;background:linear-gradient(150deg,rgba(63,185,80,.16),rgba(88,166,255,.08));border:1px solid rgba(63,185,80,.28)}
.hero h1{font-size:25px;margin:0 0 8px;font-weight:700}
.hero p{color:var(--dim);font-size:13.5px;margin:0}
.hsec{font-size:12.5px;color:var(--dim);font-weight:700;letter-spacing:.05em;margin:22px 0 11px;display:flex;align-items:center;gap:8px}
.hsec::after{content:'';flex:1;height:1px;background:var(--line)}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kind{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;cursor:pointer;transition:.18s}
.kind:active{transform:scale(.975);background:var(--panel)}
.kind .ki{font-size:23px;line-height:1}
.kind .kn{font-size:15px;font-weight:650;margin-top:9px}
.kind .kd{font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
.wlist{display:flex;flex-direction:column;gap:9px}
.witem{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 15px;cursor:pointer}
.witem:active{background:var(--panel)}
.witem .wi{font-size:18px;flex:0 0 auto}
.witem .wt{flex:1;min-width:0}
.witem .wn{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.witem .wd{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:2px}
.witem .wa{color:var(--dim2);font-size:16px}
.empty{text-align:center;color:var(--dim);font-size:13.5px;padding:26px 10px;border:1px dashed var(--line);border-radius:14px}

.edwrap{position:relative;flex:1 1 40%;min-height:0;overflow:hidden;background:var(--bg)}
.hlbox{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#hl{
  margin:0;padding:12px 13px;border:0;
  font:14px/1.62 var(--mono);
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  color:var(--text);will-change:transform;
}
#code{
  position:absolute;inset:0;width:100%;height:100%;
  background:transparent;border:0;outline:none;resize:none;
  padding:12px 13px;
  font:14px/1.62 var(--mono);
  white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;
  color:transparent;-webkit-text-fill-color:transparent;
  caret-color:var(--text);
  overflow:auto;-webkit-overflow-scrolling:touch;
}
#code::selection{background:var(--sel)}
#code::-webkit-selection{background:var(--sel)}
#code::-moz-selection{background:var(--sel)}
.tk-c{color:var(--tk-c);font-style:italic}
.tk-s{color:var(--tk-s)}
.tk-k{color:var(--tk-k);font-weight:600}
.tk-n{color:var(--tk-n)}
.tk-b{color:var(--tk-b)}

.keys{display:flex;gap:5px;overflow-x:auto;padding:6px 10px;flex:0 0 auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);-webkit-overflow-scrolling:touch}
.keys button{flex:0 0 auto;background:var(--card);border:1px solid var(--line2);color:var(--dim);border-radius:7px;font:12.5px/1 var(--mono);padding:8px 10px;cursor:pointer}
.tools{display:flex;gap:6px;padding:7px 10px;flex:0 0 auto;overflow-x:auto;-webkit-overflow-scrolling:touch}
.tools button{font-family:inherit;cursor:pointer;border:0;border-radius:9px;font-weight:600;flex:0 0 auto}
#run{flex:1 1 auto;min-width:92px;padding:11px;background:var(--accbg);color:#fff;font-size:14.5px}
#run:disabled{opacity:.45}
.tools .gray{background:var(--btn);color:var(--text);padding:11px 13px;font-size:13.5px}
.tabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;color:var(--dim);font-family:inherit;font-size:13.5px;padding:10px;border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--text);border-bottom-color:var(--acc)}
#panes{flex:1 1 58%;position:relative;overflow:hidden;min-height:0}
.pane{position:absolute;inset:0;overflow:auto;opacity:0;pointer-events:none;z-index:1;transition:opacity .15s}
.pane.on{opacity:1;pointer-events:auto;z-index:2}
#out{margin:0;padding:12px;font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--text)}
#out img{border-radius:9px}
.err{color:var(--bad)}.warn{color:var(--warn)}.info{color:var(--blue)}.okc{color:var(--acc)}
.gotoline{display:inline-block;background:var(--btn);border:1px solid var(--line2);color:var(--blue);font:12.5px/1 var(--mono);padding:9px 13px;border-radius:9px;margin:4px 0 10px;cursor:pointer}
.gotoline:active{background:var(--btnA)}
#paneTurtle{overflow:hidden;background:#fff}
#tbox{position:relative;width:100%;height:100%}
#cvP,#cvT{position:absolute;inset:0;width:100%;height:100%}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);color:var(--dim);font-size:13.5px;z-index:9;text-align:center}
#loading.hide{display:none}
.spin{width:26px;height:26px;border:2.5px solid var(--line2);border-top-color:var(--acc);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

.mask{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;display:none}
.mask.on{display:block}
.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--hd);border-top:1px solid var(--line2);border-radius:20px 20px 0 0;padding:18px 15px calc(22px + env(safe-area-inset-bottom));max-height:84dvh;overflow-y:auto;animation:up .25s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(26px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 14px;font-size:16px}
.sheet .row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px;margin-bottom:7px;cursor:pointer}
.sheet .row.cur{border-color:var(--acc)}
.sheet .row .t{flex:1;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .row .x{color:var(--bad);font-size:16px;padding:0 4px}
.sheet .act{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:13px 14px;margin-bottom:8px;font-family:inherit;font-size:14.5px;cursor:pointer}
.sheet .act:active{background:var(--panel)}
.sheet .cls{width:100%;background:var(--btn);color:var(--text);border:0;border-radius:11px;padding:13px;font-family:inherit;font-size:14.5px;margin-top:6px}
.sheet input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:10px;color:var(--text);font:12.5px var(--mono);padding:10px 12px;outline:none;margin-bottom:10px}
.sheet input:focus{border-color:var(--acc)}
.mini{font-size:12.5px;color:var(--dim);line-height:1.65;margin:8px 0 12px}
.pkgs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.pkg{font:12px var(--mono);padding:6px 11px;border-radius:8px;background:var(--card);border:1px solid var(--line2);color:var(--dim)}
.pkg.on{background:rgba(63,185,80,.14);border-color:var(--acc);color:var(--acc)}
.sgrp{font-size:12px;color:var(--dim);font-weight:700;letter-spacing:.06em;margin:16px 0 8px}
.sgrp:first-child{margin-top:0}
.sni{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:7px;cursor:pointer;font-size:14.5px;display:flex;align-items:center;gap:9px}
.sni:active{background:var(--panel)}
.sni .sn{flex:1}
.sni .sc{font-size:11.5px;color:var(--dim);font-family:var(--mono)}

#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,12px);z-index:99;background:var(--hd);border:1px solid var(--line2);color:var(--text);font-size:14.5px;padding:12px 19px;border-radius:13px;max-width:84vw;text-align:center;opacity:0;pointer-events:none;transition:.24s;box-shadow:0 14px 40px -14px rgba(0,0,0,.5)}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--bad);color:var(--bad)}
</style>
</head>
<body>

<div id="app">

  <section class="pg on" id="v-home">
    <div class="bar">
      <h1 style="text-align:center">🐍 手机 Python</h1>
      <span id="st">加载中</span>
      <button class="btheme">☀️</button>
    </div>
    <div class="hpad">
      <div class="hero">
        <div class="orb">🐍</div>
        <h1>手机上跑 Python</h1>
        <p>选一个开始，代码已经帮你起好头</p>
      </div>

      <div class="hsec">新建</div>
      <div class="kinds" id="kinds"></div>

      <div class="hsec">我的题目</div>
      <div id="wlist"></div>
    </div>
  </section>

  <section class="pg" id="v-edit">
    <div class="bar">
      <button id="bBack">←</button>
      <h1 id="eTitle" style="text-align:center">题目</h1>
      <button class="btheme">☀️</button>
      <button id="bWk">📚</button>
    </div>

    <div class="edwrap">
      <div class="hlbox"><pre id="hl"></pre></div>
      <textarea id="code" spellcheck="false" autocapitalize="off" autocorrect="off"></textarea>
    </div>

    <div class="keys" id="keys"></div>
    <div class="tools">
      <button id="run">▶ 运行</button>
      <button class="gray" id="bSnip">📎</button>
      <button class="gray" id="bLib">📦</button>
      <button class="gray" id="bEx">导出</button>
      <button class="gray" id="bClear">✕</button>
    </div>
    <div class="tabs">
      <button class="on" data-p="out">📋 输出</button>
      <button data-p="turtle">🐢 画布</button>
    </div>
    <div id="panes">
      <div class="pane on" id="paneOut"><pre id="out"></pre></div>
      <div class="pane" id="paneTurtle">
        <div id="tbox"><canvas id="cvP"></canvas><canvas id="cvT"></canvas></div>
      </div>
      <div id="loading">
        <div class="spin"></div><div>正在加载 Python 引擎…</div>
        <div style="font-size:12px;opacity:.7">首次约 10MB，十几秒；之后走缓存</div>
      </div>
    </div>
  </section>

</div>

<div id="toast"></div>

<div class="mask" id="mask1"><div class="sheet" id="shWk"></div></div>
<div class="mask" id="mask2"><div class="sheet" id="shEx"></div></div>
<div class="mask" id="mask3"><div class="sheet" id="shLib"></div></div>
<div class="mask" id="mask4"><div class="sheet" id="shSnip"></div></div>

<input type="file" id="fileIp" accept=".ipynb,application/json" style="display:none">

<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<script>
/* =====================================================================
   一、海龟引擎
   ===================================================================== */
window._tg = (function(){
  var W=0,H=0, ops=[], x=0,y=0,a=0, dn=true;
  var pc='#111111', fc='#111111', pw=2, fill=null, vis=true;
  var cvP,cvT,cP,cT, K=1, CX=0, CY=0, dirty=false, bgImg=null;

  function SX(v){ return W/2 + (v-CX)*K; }
  function SY(v){ return H/2 - (v-CY)*K; }

  function mark(){
    if (dirty) return;
    dirty = true;
    requestAnimationFrame(function(){ dirty=false; paint(); });
  }

  function line(x1,y1,x2,y2){
    if (!dn) return;
    ops.push({t:'l',x1:x1,y1:y1,x2:x2,y2:y2,c:pc,w:pw});
  }
  function fd(d){
    var r=a*Math.PI/180, nx=x+d*Math.cos(r), ny=y+d*Math.sin(r);
    line(x,y,nx,ny); x=nx; y=ny;
    if (fill) fill.push([nx,ny]);
    mark();
  }
  function jump(nx,ny){
    line(x,y,nx,ny); x=nx; y=ny;
    if (fill) fill.push([nx,ny]);
    mark();
  }
  function circ(r,ext,steps){
    if (ext===undefined||ext===null) ext=360;
    var n=(steps&&steps>0)?steps:Math.max(20,Math.ceil(Math.abs(ext)));
    var per=Math.abs(ext)/n, ch=2*Math.abs(r)*Math.sin(per*Math.PI/360);
    var left=((r>0)===(ext>0));
    for (var i=0;i<n;i++){
      a += left?per:-per;
      var rad=a*Math.PI/180, nx=x+ch*Math.cos(rad), ny=y+ch*Math.sin(rad);
      line(x,y,nx,ny); x=nx; y=ny;
      if (fill) fill.push([nx,ny]);
    }
    mark();
  }
  function bbox(){
    if (!ops.length) return null;
    var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9, has=false;
    function acc(px,py){
      has=true;
      if(px<x0)x0=px; if(px>x1)x1=px;
      if(py<y0)y0=py; if(py>y1)y1=py;
    }
    for (var i=0;i<ops.length;i++){
      var o=ops[i];
      if (o.t==='l'){ acc(o.x1,o.y1); acc(o.x2,o.y2); }
      else if (o.t==='f'){ for (var j=0;j<o.p.length;j++) acc(o.p[j][0],o.p[j][1]); }
      else if (o.t==='p'){ acc(o.x-o.r/2,o.y-o.r/2); acc(o.x+o.r/2,o.y+o.r/2); }
      else if (o.t==='t'){ acc(o.x,o.y); acc(o.x+o.s.length*9,o.y+14); }
    }
    return has ? {x0:x0,y0:y0,x1:x1,y1:y1} : null;
  }
  function grid(){
    var st = 40*K;
    while (st < 26) st *= 2;
    cP.strokeStyle = 'rgba(15,35,60,.055)';
    cP.lineWidth = 1;
    cP.beginPath();
    var o = SX(0), i;
    var s0 = o - Math.floor(o/st)*st;
    for (i=s0;i<W;i+=st){ cP.moveTo(i,0); cP.lineTo(i,H); }
    o = SY(0);
    s0 = o - Math.floor(o/st)*st;
    for (i=s0;i<H;i+=st){ cP.moveTo(0,i); cP.lineTo(W,i); }
    cP.stroke();
  }
  function arrow(){
    if (!cT) return;
    var dpr = window.devicePixelRatio || 1;
    cT.setTransform(1,0,0,1,0,0);
    cT.clearRect(0,0,cT.canvas.width,cT.canvas.height);
    cT.setTransform(dpr,0,0,dpr,0,0);
    if (!vis) return;
    cT.save();
    cT.translate(SX(x),SY(y));
    cT.rotate(-a*Math.PI/180);
    cT.fillStyle='#2ea043';
    cT.shadowColor='rgba(46,160,67,.35)';
    cT.shadowBlur=6;
    cT.beginPath();
    cT.moveTo(12,0); cT.lineTo(-8,-7); cT.lineTo(-8,-2.6);
    cT.lineTo(-11,-2.6); cT.lineTo(-11,2.6); cT.lineTo(-8,2.6);
    cT.lineTo(-8,7); cT.closePath(); cT.fill();
    cT.restore();
  }
  function paint(){
    if (!cP) return;
    cP.setTransform(1,0,0,1,0,0);
    var dpr = window.devicePixelRatio || 1;
    cP.setTransform(dpr,0,0,dpr,0,0);
    cP.fillStyle = '#fdfdfb';
    cP.fillRect(0,0,W,H);

    if (bgImg && !ops.length){
      var sc = Math.min((W-24)/bgImg.width, (H-24)/bgImg.height);
      var iw = bgImg.width*sc, ih = bgImg.height*sc;
      cP.drawImage(bgImg, (W-iw)/2, (H-ih)/2, iw, ih);
      if (cT){
        cT.setTransform(1,0,0,1,0,0);
        cT.clearRect(0,0,cT.canvas.width,cT.canvas.height);
      }
      return;
    }

    var bb = bbox();
    K = 1; CX = 0; CY = 0;
    if (bb){
      var w = Math.max(bb.x1-bb.x0, 1), h = Math.max(bb.y1-bb.y0, 1);
      K = Math.min((W-46)/w, (H-46)/h);
      if (!isFinite(K) || K<=0) K = 1;
      K = Math.min(K, 6);
      CX = (bb.x0+bb.x1)/2;
      CY = (bb.y0+bb.y1)/2;
    }
    grid();

    for (var i=0;i<ops.length;i++){
      var o = ops[i];
      if (o.t==='l'){
        cP.strokeStyle=o.c;
        cP.lineWidth=Math.max(1.1, Math.min(o.w*K, 14));
        cP.lineCap='round'; cP.lineJoin='round';
        cP.beginPath();
        cP.moveTo(SX(o.x1),SY(o.y1));
        cP.lineTo(SX(o.x2),SY(o.y2));
        cP.stroke();
      } else if (o.t==='f'){
        if (o.p.length<3) continue;
        cP.beginPath();
        cP.moveTo(SX(o.p[0][0]),SY(o.p[0][1]));
        for (var j=1;j<o.p.length;j++) cP.lineTo(SX(o.p[j][0]),SY(o.p[j][1]));
        cP.closePath();
        cP.fillStyle=o.c; cP.fill();
      } else if (o.t==='p'){
        cP.beginPath();
        cP.arc(SX(o.x),SY(o.y), Math.max(2,(o.r*K)/2), 0, Math.PI*2);
        cP.fillStyle=o.c; cP.fill();
      } else if (o.t==='t'){
        cP.fillStyle=o.c;
        cP.font = Math.max(11, Math.min(17, 13*Math.sqrt(K)))+'px -apple-system,sans-serif';
        cP.fillText(o.s, SX(o.x), SY(o.y));
      }
    }
    arrow();
  }
  function init(){
    cvP=document.getElementById('cvP'); cvT=document.getElementById('cvT');
    var b=document.getElementById('tbox').getBoundingClientRect();
    W = b.width>10 ? b.width : 320;
    H = b.height>10 ? b.height : 320;
    var dpr=window.devicePixelRatio||1;
    [cvP,cvT].forEach(function(c){
      c.width=Math.round(W*dpr); c.height=Math.round(H*dpr);
    });
    cP=cvP.getContext('2d'); cT=cvT.getContext('2d');
    paint();
  }
  function clearAll(){
    ops=[]; x=0;y=0;a=0; dn=true; pc='#111111'; fc='#111111'; pw=2;
    fill=null; vis=true; K=1; CX=0; CY=0; bgImg=null;
    paint();
  }

  return {

/* =====================================================================
   十一、运行
   ===================================================================== */
async function run(){
  if(!py){ put('引擎还在加载，请稍等…\n','warn'); return; }
  var code=ed.value;
  if(!code.trim()){ put('代码是空的。\n','warn'); return; }

  clean();
  window.__fmPlots = [];
  window._tg.init();
  window._tg.reset();

  var sc = scan(code);
  if (sc.bad.length){
    var sb = '⚠ 检测到可能跑不了的模块：\n';
    for (var bi=0;bi<sc.bad.length;bi++) sb += '   · '+sc.bad[bi]+' —— '+BAD[sc.bad[bi]]+'\n';
    put(sb, 'warn');
  }

  var btn=$('#run'); btn.disabled=true; btn.textContent='运行中…';

  var todo = sc.need.filter(function(n){ return !loaded[n]; });
  if (todo.length){
    put('📦 正在下载：' + todo.join('、') + '\n', 'info');
    put('   首次比较慢，之后浏览器会缓存\n', 'info');
    var t1 = Date.now();
    try{
      for (var k=0;k<todo.length;k++){
        await py.loadPackage(todo[k], {
          messageCallback: function(m){
            if (/Downloading|Loading|Loaded/.test(String(m))) put('   ' + m + '\n', 'info');
          }
        });
        loaded[todo[k]] = true;
      }
      put('✓ 库已就绪（' + ((Date.now()-t1)/1000).toFixed(1) + 's）\n', 'okc');
    }catch(e){
      put('✗ 库下载失败：' + (e.message||e) + '\n', 'err');
      put('  检查网络后刷新页面重试。\n', 'warn');
      btn.disabled=false; btn.textContent='▶ 运行';
      return;
    }
  }

  var hasT = /import[ \t]+turtle|from[ \t]+turtle/.test(code);
  var hasM = /import[ \t]+matplotlib|from[ \t]+matplotlib/.test(code);
  tab(hasM ? 'out' : (hasT ? 'turtle' : 'out'));

  var t0 = Date.now();
  try{
    if (hasM){
      await py.runPythonAsync(FG_PY);
      if (fontReady) await py.runPythonAsync(FONT_PY);
    }
    await py.runPythonAsync(code);
    put('\n—— 运行结束（'+(Date.now()-t0)+' ms）\n','info');
  }catch(e){
    var em = String(e.message||e);
    put('\n'+em+'\n','err');
    var hits = em.match(/line (\d+)/g);
    if (hits && hits.length){
      var ln = parseInt(hits[hits.length-1].replace(/\D/g,''), 10);
      if (ln > 0){
        var gb = document.createElement('button');
        gb.className = 'gotoline';
        gb.textContent = '↗ 跳到第 ' + ln + ' 行';
        gb.onclick = function(){ gotoLine(ln); };
        outEl.appendChild(gb);
        put('\n');
      }
    }
    tab('out');
  }
  btn.disabled=false; btn.textContent='▶ 运行';

  var it=WK.items[WK.cur];
  it.code=code;
  it.out=outEl.textContent||'';
  if (window.__fmPlots.length){
    it.img = 'data:image/png;base64,' + window.__fmPlots[0];
  } else if (hasT && window._tg.size()[0]>10){
    try{ it.img=window._tg.png().toDataURL('image/png'); }catch(e){ it.img=null; }
  }
  wsave();
}
/* =====================================================================
   十二、编辑器增强（语法高亮 / 主题 / 跳转）
   ===================================================================== */
var PY_RE = /(#.*)|('''[\s\S]*?'''|"""[\s\S]*?""")|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(import|from|as|def|class|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|try|except|finally|raise|with|lambda|yield|global|nonlocal|assert|del|pass|break|continue|async|await|match|case)\b|\b(\d[\d_]*\.?[\d_]*(?:[eE][+-]?\d+)?)\b|\b(print|len|range|int|float|str|list|dict|set|tuple|sum|max|min|abs|round|sorted|enumerate|zip|map|filter|open|input|isinstance|type|super|self|bool|complex|bytes|repr|format|help|dir|vars|id|hash)\b/g;

function escH(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function highlight(src){
  if (src.length > 60000) return escH(src);
  var out='', last=0, m;
  PY_RE.lastIndex = 0;
  while ((m = PY_RE.exec(src))){
    if (m.index > last) out += escH(src.slice(last, m.index));
    var cls = m[1] ? 'c' : ((m[2]||m[3]) ? 's' : (m[4] ? 'k' : (m[5] ? 'n' : 'b')));
    out += '<span class="tk-'+cls+'">' + escH(m[0]) + '</span>';
    last = m.index + m[0].length;
    if (m[0].length === 0) PY_RE.lastIndex++;
  }
  out += escH(src.slice(last));
  return out;
}

var hlEl = document.getElementById('hl');

function renderHL(){

function gotoLine(n){
  var ls = ed.value.split('\n');
  if (!ls.length) return;
  if (n < 1) n = 1;
  if (n > ls.length) n = ls.length;
  var pos = 0;
  for (var i = 0; i < n - 1; i++) pos += ls[i].length + 1;
  ed.focus();
  try{ ed.setSelectionRange(pos, pos + (ls[n-1] || '').length); }catch(e){}
  renderHLSoon();
}

}

function dl(name, data, mime){
  var blob = (data instanceof Blob) ? data : new Blob([data], {type: mime||'text/plain;charset=utf-8'});
  var u=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(u); }, 5000);
}
function nbSrc(text){
  var ls=String(text||'').split('\n'), out=[];
  for (var i=0;i<ls.length;i++) out.push(i<ls.length-1 ? ls[i]+'\n' : ls[i]);
  if (!out.length) out=[''];
  return out;
}
function nbCodeCell(it, n){
  var out=[];
  if (it.out && it.out.trim())
    out.push({name:'stdout', output_type:'stream', text:nbSrc(it.out)});
  if (it.img)
    out.push({data:{'image/png': String(it.img).split(',')[1]}, metadata:{}, output_type:'display_data'});
  return {cell_type:'code', execution_count:n, metadata:{}, outputs:out, source:nbSrc(it.code)};
}
function buildNb(items){
  var cells=[];
  items.forEach(function(it,i){
    cells.push({cell_type:'markdown', metadata:{}, source:nbSrc('### '+(it.title||('题目 '+(i+1))))});
    cells.push(nbCodeCell(it, i+1));
  });
  return {
    cells:cells,
    metadata:{
      kernelspec:{display_name:'Python 3', language:'python', name:'python3'},
      language_info:{name:'python', version:'3.12.0', mimetype:'text/x-python',
        file_extension:'.py', pygments_lexer:'ipython3', nbconvert_exporter:'python',
        codemirror_mode:{name:'ipython', version:3}}
    },
    nbformat:4, nbformat_minor:5
  };
}
function safe(s){ return String(s||'work').replace(/[\\/:*?"<>|]/g,'_').slice(0,30); }

   十七、导入 .ipynb
   ===================================================================== */
function nbText(src){
  if (Array.isArray(src)) return src.join('');
  return String(src==null?'':src);
}
function parseNb(json){
  var cells=json.cells||[], items=[], cur=null, i, j;
  for (i=0;i<cells.length;i++){
    var c=cells[i];
    if (c.cell_type==='markdown'){
      var m=nbText(c.source).match(/^#+[ \t]*(.+)$/m);
      if (m){ cur={title:m[1].trim(),code:'',out:'',img:null,kind:'calc'}; items.push(cur); }
      continue;
    }
    if (c.cell_type!=='code') continue;
    var tgt;
    if (cur && !cur.used){ tgt=cur; }
    else { tgt={title:'导入 '+(items.length+1),code:'',out:'',img:null,kind:'calc'}; items.push(tgt); }
    tgt.used=true;
    tgt.code=nbText(c.source);
    var outs=c.outputs||[];
    for (j=0;j<outs.length;j++){
      var o=outs[j];
      if (o.output_type==='stream'){ tgt.out+=nbText(o.text); }
      else if (o.data && o.data['image/png']){
        var b=o.data['image/png'];
        tgt.img='data:image/png;base64,'+(Array.isArray(b)?b.join(''):String(b)).replace(/\s+/g,'');
      } else if (o.text){ tgt.out+=nbText(o.text); }
    }
  }
  for (i=0;i<items.length;i++) delete items[i].used;
  return items;
}
$('#fileIp').onchange=function(){
  var f=this.files && this.files[0];
  if(!f) return;
  if(f.size>8*1024*1024){ alert('文件超过 8MB，手机上可能打不开'); this.value=''; return; }
  var fr=new FileReader();
  fr.onload=function(){
    var items;
    try{
      var j=JSON.parse(fr.result);
      if(!j || !j.cells) throw new Error('不是合法的 notebook 文件');
      items=parseNb(j);
    }catch(e){ alert('读取失败：'+e.message); return; }
    if(!items.length){ alert('这个文件里没有找到可导入的代码'); return; }
    wstore();
    for(var i=0;i<items.length;i++) WK.items.splice(i,0,items[i]);
    WK.cur=0;
    wsave(); wload(); renderHome();
    alert('已导入 '+items.length+' 道题目');
  };
  fr.readAsText(f);
  this.value='';
};

  $('#keys').appendChild(b);
});

$('#run').onclick=run;
$('#bClear').onclick=function(){ ed.value=''; clean(); ed.focus(); renderHL(); wstore(); };
$('#bWk').onclick=function(){ drawWk(); $('#mask1').classList.add('on'); };
$('#bEx').onclick=function(){ drawEx(); $('#mask2').classList.add('on'); };
$('#bLib').onclick=function(){ drawLib(); $('#mask3').classList.add('on'); };
$('#bSnip').onclick=function(){ drawSnip(); $('#mask4').classList.add('on'); };

$$('.btheme').forEach(function(b){ b.onclick = toggleTheme; });

$('#bBack').onclick=function(){
  wstore();
  renderHome();
  show('v-home');
};

['mask1','mask2','mask3','mask4'].forEach(function(id){
  var m=document.getElementById(id);
  if(m) m.onclick=function(e){ if(e.target===m) closeAll(); };
});

$$('.tabs button').forEach(function(b){
  b.onclick=function(){ tab(b.dataset.p); };
});

/* 输入 → 高亮（滚动用 rAF，高亮 130ms 防抖） */
ed.addEventListener('scroll', syncScrollSoon, {passive:true});
ed.addEventListener('compositionstart', function(){ composing = true; });
ed.addEventListener('compositionend', function(){
  composing = false;
  renderHLSoon();
});
ed.addEventListener('input', function(){
  if (!composing) renderHLSoon();
  wstore();
});

var rt;
window.addEventListener('resize', function(){
  clearTimeout(rt);
  rt=setTimeout(function(){
    if($('#paneTurtle').classList.contains('on')) window._tg.init();
    syncScroll();
  }, 300);
});

/* =====================================================================
   十九、启动
   ===================================================================== */
applyTheme();
window._tg.init();
renderHome();
renderHL();
boot();
</script>
</body>
</html>
